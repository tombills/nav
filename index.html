<style>
:root{
  --bg:#f7f8fa;
  --card:#ffffff;
  --text:#1f2329;
  --text-2:#6b7280;
  --border:#e8eaee;
  --accent:#2b5cff;
  --accent-soft:#eef3ff;
  --sidebar-bg:#ffffff;
  --shadow:0 1px 3px rgba(20,30,60,.06);
  --shadow-hover:0 8px 24px rgba(20,30,60,.12);
  --radius:10px;
}
html.dark{
  --bg:#15171c;
  --card:#1e2128;
  --text:#e6e8ec;
  --text-2:#9aa1ad;
  --border:#2b2f38;
  --accent:#4d79ff;
  --accent-soft:#232a3d;
  --sidebar-bg:#1a1d23;
  --shadow:0 1px 3px rgba(0,0,0,.3);

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{

}
a{text-decoration:none;color:inherit}
img{display:block}

/* ---------- 侧边栏 ---------- */
.sidebar{
  width:224px;flex-shrink:0;background:var(--sidebar-bg);
  border-right:1px solid var(--border);
  position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:120;
  padding:14px 12px 40px;
  transition:transform .25s,background .25s;
}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.logo-mark{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,#2b5cff,#7a3bff);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:17px;letter-spacing:-.5px;
}
.logo-name{font-size:18px;font-weight:700}
.logo-name span{color:var(--accent)}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:8px;font-size:14px;color:var(--text-2);
  cursor:pointer;margin-bottom:1px;transition:.15s;
}
.nav-item:hover{background:var(--accent-soft);color:var(--accent)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .ico{font-size:15px;width:20px;text-align:center}
.nav-sub{
  display:block;padding:5px 12px 5px 42px;font-size:12.5px;color:var(--text-2);
  border-radius:6px;cursor:pointer;transition:.15s;
}
.nav-sub:hover{color:var(--accent);background:var(--accent-soft)}

/* ---------- 主区域 ---------- */
.main{margin-left:224px;padding:0 26px 60px;min-width:0}

/* 顶部导航条 */
.topbar{

  display:flex;align-items:center;gap:16px;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:10px 2px;margin:0 -26px 20px;padding-left:28px;padding-right:28px;
  transition:background .25s;
}
.menu-btn{
  display:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:17px;color:var(--text);
  align-items:center;justify-content:center;flex-shrink:0;
}
.top-nav{display:flex;gap:4px;flex:1;overflow-x:auto}
.top-nav::-webkit-scrollbar{display:none}
.top-nav a{
  padding:7px 14px;border-radius:8px;font-size:14px;color:var(--text-2);
  white-space:nowrap;transition:.15s;
}
.top-nav a:hover{color:var(--accent);background:var(--accent-soft)}
.theme-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:16px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:.2s;
}
.theme-btn:hover{border-color:var(--accent)}

/* 搜索区 */
.search-hero{max-width:760px;margin:6px auto 30px;text-align:center}
.search-hero h1{font-size:25px;font-weight:700;margin-bottom:4px}
.search-hero p{color:var(--text-2);font-size:13.5px;margin-bottom:16px}
.group-tabs{display:flex;justify-content:center;gap:20px;margin-bottom:10px}
.group-tab{
  font-size:14px;color:var(--text-2);cursor:pointer;padding:4px 2px;
  border-bottom:2px solid transparent;transition:.15s;
}
.group-tab:hover{color:var(--accent)}
.group-tab.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.engine-tabs{display:flex;justify-content:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.engine-tab{
  padding:5px 15px;border-radius:20px;font-size:13px;color:var(--text-2);
  cursor:pointer;border:1px solid transparent;transition:.15s;
}
.engine-tab:hover{color:var(--accent)}
.engine-tab.active{background:var(--accent);color:#fff;font-weight:600}
.search-box{
  display:flex;background:var(--card);border:2px solid var(--border);
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s;
}
.search-box:focus-within{border-color:var(--accent)}
.search-box input{
  flex:1;border:none;outline:none;padding:13px 22px;font-size:15px;
  background:transparent;color:var(--text);min-width:0;
}
.search-box button{
  border:none;background:var(--accent);color:#fff;padding:0 30px;
  font-size:15px;font-weight:600;cursor:pointer;transition:.2s;
}
.search-box button:hover{filter:brightness(1.1)}

/* 热门/最新 标签块 */
.hot-block{margin-bottom:36px}
.hot-tabs{display:flex;gap:18px;border-bottom:1px solid var(--border);margin-bottom:14px}
.hot-tab{
  font-size:16px;font-weight:600;color:var(--text-2);cursor:pointer;
  padding:6px 2px 10px;border-bottom:2px solid transparent;transition:.15s;
}
.hot-tab:hover{color:var(--accent)}
.hot-tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* 分类区 */
.section{margin-bottom:36px;scroll-margin-top:64px}
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-head .bar{width:4px;height:18px;border-radius:2px;background:var(--accent)}
.section-head h2{font-size:18px;font-weight:700}
.section-head .count{font-size:12px;color:var(--text-2);background:var(--card);border:1px solid var(--border);padding:2px 8px;border-radius:10px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-tab{

  background:var(--card);border:1px solid var(--border);cursor:pointer;transition:.15s;

.sub-tab:hover{color:var(--accent);border-color:var(--accent)}
.sub-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px;display:flex;gap:12px;align-items:flex-start;

.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--accent)}
.card .icon{

.card .icon img{width:100%;height:100%;object-fit:cover}
.card .icon .fb{

.card .info{min-width:0}
.card .name{font-size:14.5px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.float-btn:hover{color:var(--accent);border-color:var(--accent)}
.float-btn.show{display:flex}

.mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110}

body.searching .sub-grid{display:grid!important}
body.searching .sub-tabs{display:none}

/* 响应式 */
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}

  .mask.show{display:block}
  .main,footer{margin-left:0}

  .topbar{margin:0 -14px 16px;padding-left:14px;padding-right:14px}
  .menu-btn{display:flex}
  .search-hero h1{font-size:20px}
  .group-tabs{gap:14px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}html{scroll-behavior:auto}
}
</style>

/* ===================== 渲染 ===================== */
function favicon(url){
  try{ return "https://www.google.com/s2/favicons?domain=" + new URL(url).hostname + "&sz=64"; }
  catch(e){ return ""; }
}

function cardHTML(t, gi){
  const [name, desc, url] = t;
  return `<a class="card" href="${url}" target="_blank" rel="noopener" data-name="${name.toLowerCase()}" data-desc="${desc.toLowerCase()}">
    <div class="icon">
      <img src="${favicon(url)}" alt="${name}" loading="lazy"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="fb" style="background:${GRADS[gi%GRADS.length]}">${name[0]}</div>
    </div>
    <div class="info">
      <div class="name">${name}</div>
      <div class="desc" title="${desc}">${desc}</div>
    </div>
  </a>`;
}

function renderNav(){
  document.getElementById("navList").innerHTML = DATA.map(s => {
    let html = `<a class="nav-item" href="#${s.id}" data-id="${s.id}" onclick="setActive('${s.id}');toggleSidebar(false)">
      <span class="ico">${s.icon}</span>${s.name}</a>`;
    if(s.subs.length > 1){
      html += s.subs.map((sub,i)=>
        `<a class="nav-sub" href="#${s.id}" onclick="switchSub('${s.id}',${i});toggleSidebar(false)">${sub.name}</a>`).join("");
    }
    return html;
  }).join("");
}

        s.subs.map((sub,i)=>`<div class="sub-tab ${i===0?'active':''}" onclick="switchSub('${s.id}',${i})">${sub.name}</div>`).join("") +
        `</div>` : "";
    const grids = s.subs.map((sub,i)=>
      `<div class="grid sub-grid" id="grid-${s.id}-${i}" style="${i===0?'':'display:none'}">
         ${sub.tools.map((t,j)=>cardHTML(t,j)).join("")}
       </div>`).join("");
    return `<section class="section" id="${s.id}">
      <div class="section-head">
        <div class="bar"></div>
        <h2>${s.icon} ${s.name}</h2>
        <span class="count">${total} 款</span>
      </div>
      ${tabs}${grids}
    </section>`;
  }).join("");
}

function renderHot(){
  document.getElementById("hotGrid0").innerHTML = HOT.map((t,i)=>cardHTML(t,i)).join("");
  document.getElementById("hotGrid1").innerHTML = NEWEST.map((t,i)=>cardHTML(t,i)).join("");
}

function renderSearch(){
  document.getElementById("groupTabs").innerHTML = GROUPS.map((g,i)=>
    `<div class="group-tab ${i===gIdx?'active':''}" onclick="setGroup(${i})">${g[0]}</div>`).join("");
  document.getElementById("engineTabs").innerHTML = GROUPS[gIdx][1].map((e,i)=>
    `<div class="engine-tab ${i===eIdx?'active':''}" onclick="setEngine(${i})">${e[0]}</div>`).join("");
  const cur = GROUPS[gIdx][1][eIdx];
  document.getElementById("searchInput").placeholder =
    cur[1]===null ? "站内搜索 AI 工具..." : "在 "+cur[0]+" 中搜索...";
}
function setGroup(i){ gIdx=i; eIdx=0; renderSearch(); }
function setEngine(i){ eIdx=i; renderSearch(); }

/* ===================== 交互 ===================== */
function switchSub(secId, idx){
  const sec = DATA.find(s=>s.id===secId);
  if(!sec) return;
  const tabs = document.querySelectorAll(`#tabs-${secId} .sub-tab`);
  tabs.forEach((t,i)=>t.classList.toggle("active", i===idx));
  sec.subs.forEach((_,i)=>{
    const g = document.getElementById(`grid-${secId}-${i}`);
    if(g) g.style.display = i===idx ? "" : "none";
  });
}

function switchHot(idx){
  document.querySelectorAll(".hot-tab").forEach((t,i)=>t.classList.toggle("active", i===idx));
  document.getElementById("hotGrid0").style.display = idx===0 ? "" : "none";
  document.getElementById("hotGrid1").style.display = idx===1 ? "" : "none";
}

function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  const cur = GROUPS[gIdx][1][eIdx];
  if(cur[1] !== null){
    if(q) window.open(cur[1]+encodeURIComponent(q), "_blank");
    return;
  }
  const kw = q.toLowerCase();
  document.body.classList.toggle("searching", !!kw);
  document.querySelectorAll(".section .card").forEach(c=>{
    const hit = !kw || c.dataset.name.includes(kw) || c.dataset.desc.includes(kw);
    c.style.display = hit ? "" : "none";
  });
  document.querySelectorAll(".section").forEach(s=>{
    const visible = [...s.querySelectorAll(".card")].some(c=>c.style.display!=="none");
    s.style.display = (!kw || visible) ? "" : "none";
  });
  if(!kw){ /* 恢复各分类的子标签状态 */
    DATA.forEach(s=>{
      const tabs = document.querySelectorAll(`#tabs-${s.id} .sub-tab`);
      let act = 0; tabs.forEach((t,i)=>{ if(t.classList.contains("active")) act=i; });
      switchSub(s.id, act);
    });
  }
}
document.addEventListener("input", e=>{
  if(e.target.id==="searchInput" && GROUPS[gIdx][1][eIdx][1]===null) doSearch();
});

let dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(){
  document.documentElement.classList.toggle("dark", dark);
  document.getElementById("themeBtn").textContent = dark ? "☀️" : "🌙";
}
function toggleTheme(){ dark=!dark; applyTheme(); }

function toggleSidebar(open){
  document.getElementById("sidebar").classList.toggle("open", open);
  document.getElementById("mask").classList.toggle("show", open);
}

function setActive(id){
  document.querySelectorAll(".nav-item").forEach(n=>
    n.classList.toggle("active", n.dataset.id===id));
}

window.addEventListener("scroll", ()=>{
  let cur = DATA[0].id;
  for(const s of DATA){
    const el = document.getElementById(s.id);
    if(el && el.getBoundingClientRect().top < 130) cur = s.id;
  }
  setActive(cur);
  document.getElementById("backTop").classList.toggle("show", window.scrollY > 400);
}, {passive:true});

/* 初始化 */
renderNav();
renderSections();
renderHot();
renderSearch();
applyTheme();
setActive(DATA[0].id);
</script>
</body>
</html>
